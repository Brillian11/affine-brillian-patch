version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # AFFiNE Self-Hosted Server & Web Client
  # ---------------------------------------------------------------------------
  affine_server:
    image: ghcr.io/toeverything/affine-graphql:stable
    container_name: affine_server
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      AFFINE_ENV: production
      AFFINE_SERVER_PORT: 3010
      AFFINE_SERVER_HOST: 0.0.0.0
      AFFINE_SERVER_EXTERNAL_URL: https://affine.yourdomain.com
      DB_HOST: affine_postgres
      DB_PORT: 5432
      DB_NAME: affine
      DB_USER: affine
      DB_PASSWORD: ${AFFINE_DB_PASSWORD:-affine_secure_pass}
      REDIS_SERVER_HOST: affine_redis
      REDIS_SERVER_PORT: 6379
      AFFINE_STORAGE_TYPE: fs
      AFFINE_STORAGE_FS_PATH: /app/data/storage
      # MCP & Copilot Configuration
      COPILOT_ENABLED: "true"
      EXPERIMENTAL_MCP_ENABLED: "true"
    volumes:
      - /data/affine/data:/app/data
      - /data/affine/static:/app/apps/web/dist
    depends_on:
      - affine_postgres
      - affine_redis

  affine_postgres:
    image: postgres:16-alpine
    container_name: affine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: affine
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: ${AFFINE_DB_PASSWORD:-affine_secure_pass}
    volumes:
      - /data/affine/pgdata:/var/lib/postgresql/data

  affine_redis:
    image: redis:7-alpine
    container_name: affine_redis
    restart: unless-stopped
    volumes:
      - /data/affine/redisdata:/data
